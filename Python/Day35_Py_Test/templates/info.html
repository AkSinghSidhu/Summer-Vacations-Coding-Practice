<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info</title>
</head>
<body>
    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}
    <h1>Student #{{ student.id }}</h1>
    <ul>
        <li>Name: <b>{{ student.name }}</b></li>
        <li>Age: <b>{{ student.age }}</b></li>
        <li>Score: <b>{{ student.score }}</b></li>
    </ul>
    
    <form action="{{ url_for('delStudent', id = student.id) }}" method = "POST">
        <button>Delete</button>
    </form>

</body>
</html>
