<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    {% for message in get_flashed_messages() %}
        <p>{{ message }}</p>
    {% endfor %}

    <h2>Welcome,</h2>
    <h1>Name: {{ session["username"] }}</h1>
    <h1>Age: {{ session["age"] }}</h1>
</body>
</html>
